[project]
name = "jobs-radar-backend"
version = "0.1.0"
description = "Jobs Radar backend: API, worker and domain logic."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "psycopg[binary]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "structlog",
    "tzdata",
    "nh3>=0.3.7",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "geonamescache>=3.0.2",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-socket",
    "hypothesis",
    "testcontainers[postgres]",
    "respx",
    "ruff",
    "mypy",
    "import-linter",
    "bandit",
    "deptry",
    "vulture",
    "pip-licenses",
    "watchfiles",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Block every network connection except loopback and the Docker unix socket (ADR-035): a real
# outbound request in a test fails the test instead of silently hitting the internet.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1 -ra"
markers = [
    "integration: needs a PostgreSQL testcontainer",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D107", "D105"]

[tool.ruff.lint.per-file-ignores]
# Tests use synthetic passwords and tokens on purpose (to prove they are redacted).
"tests/**" = ["S101", "S104", "S105", "S106", "D", "E501"]
"alembic/**" = ["D", "E501"]
# Typographic characters are the whole point of the text-matching helpers and their tests.
"src/jobs_radar/domain/text_match.py" = ["RUF001", "RUF003"]
"tests/unit/test_text_match.py" = ["RUF001", "RUF003"]
# SQLAlchemy declarative models use a plain dict for __table_args__ by convention.
"src/jobs_radar/db/models/**" = ["RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["jobs_radar"]

[tool.coverage.run]
source = ["src/jobs_radar"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.importlinter]
root_package = "jobs_radar"

[[tool.importlinter.contracts]]
name = "Layered backend: api -> services -> repositories -> db"
type = "layers"
layers = [
    "jobs_radar.api",
    "jobs_radar.services",
    "jobs_radar.repositories",
    "jobs_radar.db",
]
containers = []
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain is pure: it imports nothing from the rest of the application"
type = "forbidden"
source_modules = ["jobs_radar.domain"]
forbidden_modules = [
    "jobs_radar.api",
    "jobs_radar.schemas",
    "jobs_radar.services",
    "jobs_radar.repositories",
    "jobs_radar.db",
    "jobs_radar.adapters",
    "jobs_radar.worker",
    "jobs_radar.core",
]

[[tool.importlinter.contracts]]
name = "Adapters never touch persistence or services"
type = "forbidden"
source_modules = ["jobs_radar.adapters"]
forbidden_modules = [
    "jobs_radar.repositories",
    "jobs_radar.db",
    "jobs_radar.services",
    "jobs_radar.api",
    "jobs_radar.worker",
]
