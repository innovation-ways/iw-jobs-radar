# Jobs Radar runtime (ADR-038). Ports and credentials come from .env (ADR-019, ADR-032).
# Create it with: ./jobs-radar.sh --init-env
name: jobs-radar

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${JOBS_RADAR_DB_NAME:-jobs_radar}
      POSTGRES_USER: ${JOBS_RADAR_DB_USER:-jobs_radar}
      POSTGRES_PASSWORD: ${JOBS_RADAR_DB_PASSWORD:?run ./jobs-radar.sh --init-env first}
    ports:
      # Loopback only unless JOBS_RADAR_DB_BIND says otherwise (see .env.example).
      - "${JOBS_RADAR_DB_BIND:-127.0.0.1}:${JOBS_RADAR_DB_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - .env
    # Host networking, like the other local services that share the host's Ollama: the container
    # reaches Ollama on 127.0.0.1 (which only listens on loopback) and PostgreSQL on its published
    # loopback port (JOBS_RADAR_DB_HOST/PORT from .env). There is no `ports` mapping any more, so
    # the exposure of the API is decided by uvicorn's --host, i.e. JOBS_RADAR_API_BIND (ADR-009).
    network_mode: host
    # Migrations run before the server starts.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn jobs_radar.api.app:create_app --factory
             --host ${JOBS_RADAR_API_BIND:-127.0.0.1} --port ${JOBS_RADAR_API_PORT:-8100}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('JOBS_RADAR_API_PORT', '8100'), timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    network_mode: host  # same reason as the api service
    command: ["python", "-m", "jobs_radar.worker"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # In development the frontend runs outside containers (ADR-019): `./jobs-radar.sh --frontend-start`.
  # Uncomment to serve it from a container instead.
  # frontend:
  #   build:
  #     context: ./frontend
  #   ports:
  #     - "${JOBS_RADAR_API_BIND:-127.0.0.1}:${JOBS_RADAR_FRONTEND_PORT:-5180}:80"
  #   depends_on:
  #     - api

volumes:
  pgdata:
