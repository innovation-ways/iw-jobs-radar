# Minimal CI (ADR-019 deferred it; added at release hardening, T8). It runs the same local gates as
# `make check`: lint, types, architecture, security (bandit), licences, column docs, unit and
# integration tests (PostgreSQL via testcontainers) and the frontend gates and unit tests.
# It never runs the end-to-end tests, the semgrep / gitleaks / audit scans (they need the network
# and Docker images; run `make check-all` locally) or the opt-in smoke tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # `make` calls pnpm from the repository root, where corepack finds no packageManager field and
      # would download the newest pnpm; pin the version the frontend declares.
      - name: Enable the pnpm version pinned by the frontend
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./frontend/package.json').packageManager")" --activate
      - name: Install dependencies
        run: make install
      - name: Quality gates and tests
        run: make check
