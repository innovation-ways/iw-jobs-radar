# Served by the frontend image (ADR-079). One origin for the browser: the app, and the API behind it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # CV uploads are limited by the API; leave room for them here.
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    # The API (and its health endpoints) is reached by service name on the compose network.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }
    location = /healthz { proxy_pass http://api:8000; }
    location = /readyz { proxy_pass http://api:8000; }

    # Hashed build assets never change; the HTML shell must always be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header in a location drops the server-level ones, so repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
        # Single-page app: unknown paths open the app, which routes them.
        try_files $uri /index.html;
    }
}
